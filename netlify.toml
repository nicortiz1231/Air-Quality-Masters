[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Redirects from the old site ────────────────────────────────
# These paths still resolve on aqmasters.com today, so they exist in search
# results, in link shares and on whatever printed material carries the URL.
# 301 carries their ranking to the new equivalent instead of dropping it.
#
# The old /privacy-policy served the Terms and Conditions text verbatim — the
# site had no privacy policy at all. It points at /terms rather than /privacy
# so anyone following an old link lands on the document they actually read.
[[redirects]]
  from = "/home682032"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/team"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/estimates"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/locations"
  to = "/service-areas"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/terms-conditions"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301
  force = true

# ── SPA fallback ───────────────────────────────────────────────
# Every real route is written to disk by scripts/postbuild.mjs, so any path
# that reaches this rule genuinely does not exist. It serves the app shell —
# React renders the 404 page — with a 404 STATUS, not a 200.
#
# A 200 here is a "soft 404": search engines index the nonexistent URL, and
# monitoring cannot tell a broken link from a working one. The trade is that a
# route added to App.jsx but forgotten in postbuild.mjs will 404 in production.
# That is the safer direction to fail, and it fails loudly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# ── Headers ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy. Scoped to exactly what the site loads:
    #   fonts.googleapis / fonts.gstatic — the two web font families
    #   api.web3forms.com                — the form relay, when a key is set
    # 'unsafe-inline' is required in style-src because GSAP animates by writing
    # inline style attributes; it is deliberately NOT granted to script-src.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# sitemap.xml and robots.txt are rewritten on every build; never let an edge
# cache outlive a deploy that changed which pages exist.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
